basePath: /api/v1
definitions:
  debt.Debt:
    properties:
      amount:
        type: integer
      borrower_id:
        type: integer
      borrower_username:
        type: string
      id:
        type: integer
      lender_id:
        type: integer
      lender_username:
        type: string
    type: object
  transport.CreateDebtRequest:
    properties:
      amount:
        type: integer
      borrower:
        type: string
    type: object
  transport.CreateDebtResponse:
    properties:
      id:
        type: integer
    type: object
  transport.CreateUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  transport.DebtPaymentResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      debt_id:
        type: integer
      id:
        type: integer
      note:
        type: string
      paid_at:
        type: string
      payer_id:
        type: integer
      receiver_id:
        type: integer
    type: object
  transport.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  transport.GetDebtsResponse:
    properties:
      debt_by_lender:
        additionalProperties:
          format: int32
          type: integer
        type: object
      debts:
        items:
          $ref: '#/definitions/debt.Debt'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total_amount:
        type: integer
      total_count:
        type: integer
    type: object
  transport.GetUsersResponse:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  transport.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  transport.LoginResponse:
    properties:
      access_token:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
  title: Portfolio
  version: "1.0"
paths:
  /debt:
    post:
      consumes:
      - application/json
      description: Records a debt between a lender and a borrower
      parameters:
      - description: debt payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.CreateDebtRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/transport.CreateDebtResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Create a debt
      tags:
      - debts
  /debts:
    get:
      description: Lists debts where the authenticated user is the borrower
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.GetDebtsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List debts
      tags:
      - debts
  /debts/{debt_id}/payments/:
    post:
      description: Creates a payment for the specified debt.
      parameters:
      - description: Debt ID
        format: int32
        in: path
        name: debt_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.DebtPaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Debt payments
      tags:
      - debts
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Login a user
      tags:
      - users
  /user:
    post:
      consumes:
      - application/json
      description: Registers a new user with a username and password
      parameters:
      - description: user payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transport.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      summary: Create a user
      tags:
      - users
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/transport.GetUsersResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/transport.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get users
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

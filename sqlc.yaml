version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/user/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/user/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 2rem 1rem;
    background: #f5f5f5;
  }
  .card {
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    width: 320px;
  }
  .card.wide { width: 480px; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .tabs { display: flex; margin-bottom: 1rem; border-bottom: 1px solid #ddd; }
  .tab {
    flex: 1;
    padding: 0.5rem;
    text-align: center;
    cursor: pointer;
    color: #666;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: #111; border-bottom-color: #111; font-weight: 600; }
  form { display: none; flex-direction: column; gap: 0.75rem; }
  form.active { display: flex; }
  label { font-size: 0.85rem; color: #333; }
  input {
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    padding: 0.6rem;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
  button.secondary { background: #eee; color: #111; }
  button.secondary:hover { background: #ddd; }
  .msg { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #27ae60; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .row h1 { margin: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  .empty { color: #888; font-size: 0.85rem; padding: 1rem 0; text-align: center; }
  .hidden { display: none !important; }
  .debt-form { display: flex; gap: 0.5rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .debt-form .field { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; min-width: 100px; }
  .debt-form button { flex: 0 0 auto; }
</style>
</head>
<body>
  <div id="auth-screen" class="card">
    <h1>Portfolio</h1>
    <div class="tabs">
      <div class="tab active" data-tab="login">Login</div>
      <div class="tab" data-tab="signup">Sign up</div>
    </div>

    <form id="login-form" class="active">
      <label for="login-username">Username</label>
      <input id="login-username" name="username" required autocomplete="username">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>

    <form id="signup-form">
      <label for="signup-username">Username</label>
      <input id="signup-username" name="username" required autocomplete="username">
      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" required autocomplete="new-password" minlength="8">
      <button type="submit">Create account</button>
    </form>

    <div id="auth-msg" class="msg"></div>
  </div>

  <div id="debts-screen" class="card wide hidden">
    <div class="row">
      <h1>Debts</h1>
      <div>
        <span id="whoami" style="font-size:0.85rem;color:#666;margin-right:0.75rem;"></span>
        <button type="button" class="secondary" id="logout-btn">Log out</button>
      </div>
    </div>

    <form id="debt-form" class="debt-form" style="display:flex;">
      <div class="field">
        <label for="debt-lender">Lender</label>
        <input id="debt-lender" name="lender" required>
      </div>
      <div class="field">
        <label for="debt-borrower">Borrower</label>
        <input id="debt-borrower" name="borrower" required>
      </div>
      <div class="field" style="max-width:120px;">
        <label for="debt-amount">Amount</label>
        <input id="debt-amount" name="amount" type="number" min="1" required>
      </div>
      <button type="submit">Add debt</button>
    </form>
    <div id="debt-msg" class="msg"></div>

    <table id="debts-table">
      <thead>
        <tr><th>ID</th><th>Lender (ID)</th><th>Borrower (ID)</th><th>Amount</th></tr>
      </thead>
      <tbody id="debts-body"></tbody>
    </table>
    <div id="debts-empty" class="empty hidden">No debts yet.</div>
  </div>

<script>
  const authScreen = document.getElementById('auth-screen');
  const debtsScreen = document.getElementById('debts-screen');
  const tabs = document.querySelectorAll('.tab');
  const forms = { login: document.getElementById('login-form'), signup: document.getElementById('signup-form') };
  const authMsg = document.getElementById('auth-msg');
  const debtMsg = document.getElementById('debt-msg');
  const whoami = document.getElementById('whoami');
  const debtsBody = document.getElementById('debts-body');
  const debtsEmpty = document.getElementById('debts-empty');

  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    Object.values(forms).forEach(f => f.classList.remove('active'));
    forms[tab.dataset.tab].classList.add('active');
    authMsg.textContent = '';
    authMsg.className = 'msg';
  }));

  function showMsg(el, text, ok) {
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'success' : 'error');
  }

  async function api(method, url, body) {
    const headers = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('access_token');
    if (token) headers['Authorization'] = 'Bearer ' + token;

    const res = await fetch(url, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });

    if (res.status === 401) {
      logout();
      throw new Error('session expired, please log in again');
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'request failed');
    return data;
  }

  function enterApp(username) {
    localStorage.setItem('username', username);
    authScreen.classList.add('hidden');
    debtsScreen.classList.remove('hidden');
    whoami.textContent = username;
    document.getElementById('debt-lender').value = username;
    loadDebts();
  }

  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('username');
    debtsScreen.classList.add('hidden');
    authScreen.classList.remove('hidden');
  }

  document.getElementById('logout-btn').addEventListener('click', logout);

  forms.login.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    try {
      const data = await api('POST', '/api/v1/login', { username, password });
      localStorage.setItem('access_token', data.access_token);
      enterApp(data.username);
    } catch (err) {
      showMsg(authMsg, err.message, false);
    }
  });

  forms.signup.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('signup-username').value;
    const password = document.getElementById('signup-password').value;
    try {
      const data = await api('POST', '/api/v1/user', { username, password });
      localStorage.setItem('access_token', data.access_token);
      enterApp(data.username);
    } catch (err) {
      showMsg(authMsg, err.message, false);
    }
  });

  document.getElementById('debt-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const lender = document.getElementById('debt-lender').value;
    const borrower = document.getElementById('debt-borrower').value;
    const amount = Number(document.getElementById('debt-amount').value);
    try {
      await api('POST', '/api/v1/debt', { lender, borrower, amount });
      document.getElementById('debt-borrower').value = '';
      document.getElementById('debt-amount').value = '';
      showMsg(debtMsg, 'Debt created.', true);
      loadDebts();
    } catch (err) {
      showMsg(debtMsg, err.message, false);
    }
  });

  async function loadDebts() {
    try {
      const debts = await api('GET', '/api/v1/debts');
      renderDebts(debts || []);
    } catch (err) {
      showMsg(debtMsg, err.message, false);
    }
  }

  function renderDebts(debts) {
    debtsBody.innerHTML = '';
    if (!debts.length) {
      debtsEmpty.classList.remove('hidden');
      return;
    }
    debtsEmpty.classList.add('hidden');
    for (const d of debts) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${d.ID}</td><td>${d.Lender}</td><td>${d.Borrower}</td><td>${d.Amount}</td>`;
      debtsBody.appendChild(tr);
    }
  }

  if (localStorage.getItem('access_token')) {
    enterApp(localStorage.getItem('username') || '');
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Login</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #f5f5f5;
  }
  .card {
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    width: 320px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .tabs { display: flex; margin-bottom: 1rem; border-bottom: 1px solid #ddd; }
  .tab {
    flex: 1;
    padding: 0.5rem;
    text-align: center;
    cursor: pointer;
    color: #666;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: #111; border-bottom-color: #111; font-weight: 600; }
  form { display: none; flex-direction: column; gap: 0.75rem; }
  form.active { display: flex; }
  label { font-size: 0.85rem; color: #333; }
  input {
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    padding: 0.6rem;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #333; }
  .msg { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #27ae60; }
</style>
</head>
<body>
  <div class="card">
    <h1>Portfolio</h1>
    <div class="tabs">
      <div class="tab active" data-tab="login">Login</div>
      <div class="tab" data-tab="signup">Sign up</div>
    </div>

    <form id="login-form" class="active">
      <label for="login-username">Username</label>
      <input id="login-username" name="username" required autocomplete="username">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>

    <form id="signup-form">
      <label for="signup-username">Username</label>
      <input id="signup-username" name="username" required autocomplete="username">
      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" required autocomplete="new-password" minlength="8">
      <button type="submit">Create account</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const forms = { login: document.getElementById('login-form'), signup: document.getElementById('signup-form') };
  const msg = document.getElementById('msg');

  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    Object.values(forms).forEach(f => f.classList.remove('active'));
    forms[tab.dataset.tab].classList.add('active');
    msg.textContent = '';
    msg.className = 'msg';
  }));

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'success' : 'error');
  }

  async function submitJSON(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'request failed');
    return data;
  }

  forms.login.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    try {
      const data = await submitJSON('/api/v1/login', { username, password });
      localStorage.setItem('access_token', data.access_token);
      showMsg('Logged in as ' + data.username, true);
    } catch (err) {
      showMsg(err.message, false);
    }
  });

  forms.signup.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('signup-username').value;
    const password = document.getElementById('signup-password').value;
    try {
      const data = await submitJSON('/api/v1/user', { username, password });
      showMsg('Account created for ' + data.username + '. You can log in now.', true);
    } catch (err) {
      showMsg(err.message, false);
    }
  });
</script>
</body>
</html>
